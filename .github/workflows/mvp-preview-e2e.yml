name: MVP preview e2e

on:
  pull_request:
    paths:
      - "mvp/**"
      - ".github/workflows/mvp-preview-e2e.yml"

permissions:
  contents: read
  deployments: read

concurrency:
  group: mvp-preview-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mvp
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the automation bypass secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::BLOCKED: GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not set. Glaucia must create the Vercel Protection Bypass for Automation secret and store it under that name."
            exit 1
          fi
          echo "VERCEL_AUTOMATION_BYPASS_SECRET is configured. Its value was not printed."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci
      - name: Wait for the Vercel preview of this commit
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/resolve-preview-url.mjs
      - run: npx playwright install --with-deps chromium
      - name: Decide whether this preview is the approved isolated database
        id: isolated
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          MVP_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          MVP_PREVIEW_QA_ENABLED: ${{ vars.MVP_PREVIEW_QA_ENABLED }}
          MVP_PREVIEW_APPROVED_URL: ${{ vars.MVP_PREVIEW_APPROVED_URL }}
          MVP_PREVIEW_APPROVED_COMMIT: ${{ vars.MVP_PREVIEW_APPROVED_COMMIT }}
          MVP_PREVIEW_APPROVED_QA_DATABASE_ID: ${{ vars.MVP_PREVIEW_APPROVED_QA_DATABASE_ID }}
          MVP_PREVIEW_ISOLATED_AUTHORIZED: ${{ vars.MVP_PREVIEW_ISOLATED_AUTHORIZED }}
        run: node scripts/isolated-db-flag.mjs
      - name: Run preview e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          MVP_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          MVP_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          E2E_ISOLATED_DB: ${{ steps.isolated.outputs.enabled == 'true' && 'true' || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e
      - name: Redact the bypass secret from Playwright artifacts
        if: always()
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 scripts/redact-playwright-artifacts.py
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mvp/test-results
            mvp/playwright-report
          if-no-files-found: ignore
          retention-days: 7
