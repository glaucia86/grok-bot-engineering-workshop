name: MVP validation

on:
  pull_request:
    paths:
      - "mvp/**"
      - ".github/workflows/mvp.yml"
  push:
    branches: [main]
    paths:
      - "mvp/**"
      - ".github/workflows/mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ matrix.target == 'head' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:http
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.ts
      - name: Retain local browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mvp-local-browser-evidence-${{ matrix.target }}
          path: |
            mvp/playwright-report/
            mvp/test-results/
          if-no-files-found: ignore
          retention-days: 7
