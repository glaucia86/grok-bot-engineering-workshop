name: MVP validation

on:
  pull_request:
    paths:
      - "mvp/**"
      - ".github/workflows/mvp.yml"
  push:
    branches: [main]
    paths:
      - "mvp/**"
      - ".github/workflows/mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:http
