name: Speaker site
on:
  pull_request:
    paths:
      - 'docs/speaker/**'
      - 'scripts/*speaker*'
      - 'tests/test_speaker_site.py'
      - '.github/workflows/speaker-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/speaker/**'
      - 'scripts/*speaker*'
      - 'tests/test_speaker_site.py'
      - '.github/workflows/speaker-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speaker-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/speaker-site-requirements.txt
      - run: python -m unittest discover -s tests -p test_speaker_site.py
      - run: python scripts/build_speaker_site.py --output _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy reviewed speaker site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
